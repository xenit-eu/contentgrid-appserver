openapi: "3.0.2"
info:
  description: "ContentGrid app for demo/test"
  version: "0.0.1-SNAPSHOT"
  title: "TestApiApplication"
tags:
  - name: "foo"
    description: ""
paths:
  /foos:
    get:
      tags:
        - "foo"
      operationId: "get-foos"
      summary: "Retrieve foo list"
      parameters:
        - name: "created_at"
          in: "query"
          description: "Tracks when the item was created."
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "created_at~before"
          in: "query"
          description: "Before created_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "created_at~after"
          in: "query"
          description: "After created_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "last_modified_at"
          in: "query"
          description: "Tracks when the item was last modified."
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "last_modified_at~before"
          in: "query"
          description: "Before last_modified_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "last_modified_at~after"
          in: "query"
          description: "After last_modified_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "name~prefix"
          in: "query"
          description: "Starts with name"
          required: false
          schema:
            type: "string"
        - name: "foo.created_at"
          in: "query"
          description: "Tracks when the item was created."
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foo.created_at~before"
          in: "query"
          description: "Before created_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foo.created_at~after"
          in: "query"
          description: "After created_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foo.last_modified_at"
          in: "query"
          description: "Tracks when the item was last modified."
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foo.last_modified_at~before"
          in: "query"
          description: "Before last_modified_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foo.last_modified_at~after"
          in: "query"
          description: "After last_modified_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foo.name~prefix"
          in: "query"
          description: "Starts with name"
          required: false
          schema:
            type: "string"
        - name: "foos.created_at"
          in: "query"
          description: "Tracks when the item was created."
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foos.created_at~before"
          in: "query"
          description: "Before created_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foos.created_at~after"
          in: "query"
          description: "After created_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foos.last_modified_at"
          in: "query"
          description: "Tracks when the item was last modified."
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foos.last_modified_at~before"
          in: "query"
          description: "Before last_modified_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foos.last_modified_at~after"
          in: "query"
          description: "After last_modified_at"
          required: false
          schema:
            type: "string"
            format: "date-time"
        - name: "foos.name~prefix"
          in: "query"
          description: "Starts with name"
          required: false
          schema:
            type: "string"
        - name: "_cursor"
          in: "query"
          description: "Cursor to access a page (cursors are server-generated and supplied\
          \ in the page metadata)"
          required: false
          schema:
            type: "string"
            example: "1mlpulv1"
        - name: "_size"
          in: "query"
          description: "Page size"
          required: false
          schema:
            type: "integer"
        - name: "_sort"
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
              enum:
                - "created_at,asc"
                - "created_at,desc"
                - "last_modified_at,asc"
                - "last_modified_at,desc"
              example: "created_at,asc"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fooCollection"
    post:
      tags:
        - "foo"
      operationId: "create-foo"
      summary: "Create a new foo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/fooPostBody"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/fooPostMultipartFormDataBody"
      responses:
        "201":
          description: "The foo has been created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fooResponse"
        "400":
          description: "The foo can not be created due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The foo can not be created due to a unique attribute already\
            \ existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
  /foos/{id}:
    get:
      tags:
        - "foo"
      operationId: "get-foo"
      summary: "Retrieve the foo"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fooResponse"
    put:
      tags:
        - "foo"
      operationId: "update-foo"
      summary: "Update all attributes of the foo"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/fooPutBody"
      responses:
        "200":
          description: "The foo has been updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fooResponse"
        "400":
          description: "The foo can not be updated due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The foo can not be updated due to a unique attribute already\
            \ existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    patch:
      tags:
        - "foo"
      operationId: "patch-foo"
      summary: "Update some attributes of the foo"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        description: "Only attributes that have to be updated should be specified,\
          \ other attributes should not be present"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/fooPatchBody"
      responses:
        "200":
          description: "The foo has been updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fooResponse"
        "400":
          description: "The foo can not be updated due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The foo can not be updated due to a unique attribute already\
            \ existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    delete:
      tags:
        - "foo"
      operationId: "delete-foo"
      summary: "Delete the foo"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "The foo has been deleted"
        "409":
          description: "The foo can not be deleted because it is linked via a required\
            \ relation"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
  /foos/{id}/foo:
    get:
      tags:
        - "foo"
      operationId: "get-foo-foo"
      summary: "Retrieve the foo linked with foo as foo"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fooResponse"
        "404":
          description: "The foo relation does not link to any foo"
    put:
      tags:
        - "foo"
      operationId: "update-foo-foo"
      summary: "Set the foo that is linked with foo as foo"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        description: "One foo URI"
        required: true
        content:
          text/uri-list:
            schema:
              type: "string"
              example: "/foos/00000000-0000-0000-0000-000000000000"
      responses:
        "204":
          description: "The foo is linked with foo as foo"
        "400":
          description: "Multiple URIs are given, but foo can only refer to one item"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The foo is already linked with a different foo as foo"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    delete:
      tags:
        - "foo"
      operationId: "delete-foo-foo"
      summary: "Removes the link to foo from foo"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "The link to foo has been removed from foo"
        "400":
          description: "You can not remove the foo link, because it is marked as required"
        "409":
          description: "You can not remove the foo link, because the inverse relation\
            \ is marked as required"
  /foos/{id}/foos:
    get:
      tags:
        - "foo"
      operationId: "get-foo-foos"
      summary: "Retrieve the foo list linked with foo as foos"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fooCollection"
    post:
      tags:
        - "foo"
      operationId: "add-foo-foos"
      summary: "Add links to foo list that is linked with foo as foos, in addition\
        \ to existing foo list"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        description: "Newline separated list of foo URIs"
        required: true
        content:
          text/uri-list:
            schema:
              type: "string"
              example: "/foos/00000000-0000-0000-0000-000000000000"
      responses:
        "204":
          description: "The list of foo is linked with foo as foos"
        "409":
          description: "The URI list contains some foo that is already linked with\
            \ a different foo as foos"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    delete:
      tags:
        - "foo"
      operationId: "delete-foo-foos"
      summary: "Removes all links to foo from foos"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "All links to foo have been removed from foos"
        "409":
          description: "You can not remove the foos link, because the inverse relation\
            \ is marked as required"
  /foos/{id}/foos/{itemId}:
    get:
      tags:
        - "foo"
      operationId: "get-foo-foos-item"
      summary: "Retrieve the foo identified by 'itemId' linked with foo as foos"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "itemId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fooResponse"
        "404":
          description: "The foos relation does not link to the foo identified by 'itemId'"
    delete:
      tags:
        - "foo"
      operationId: "delete-foo-foos-item"
      summary: "Removes the link to foo identified by 'itemId' from foos"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "itemId"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "The link to foo has been removed from foos"
        "409":
          description: "You can not remove the foos link, because the inverse relation\
            \ is marked as required"
components:
  schemas:
    Link:
      type: "object"
      properties:
        href:
          type: "string"
      required:
        - "href"
    problemDetail:
      type: "object"
      properties:
        type:
          type: "string"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type: "string"
        instance:
          type: "string"
    problemDetailWithProperty:
      allOf:
        - $ref: "#/components/schemas/problemDetail"
        - type: "object"
          properties:
            property:
              type: "string"
          required:
            - "property"
    problemDetailWithErrors:
      allOf:
        - $ref: "#/components/schemas/problemDetail"
        - type: "object"
          properties:
            errors:
              type: "array"
              items:
                oneOf:
                  - $ref: "#/components/schemas/problemDetail"
                  - $ref: "#/components/schemas/problemDetailWithProperty"
          required:
            - "errors"
    problemDetailDiscriminator:
      oneOf:
        - $ref: "#/components/schemas/problemDetailWithErrors"
        - $ref: "#/components/schemas/problemDetail"
      discriminator:
        propertyName: "type"
        mapping:
          https://contentgrid.cloud/problems/input/validation: "#/components/schemas/problemDetailWithErrors"
          https://contentgrid.cloud/problems/input/duplicate-value: "#/components/schemas/problemDetail"
          https://contentgrid.cloud/problems/integrity/constraint-violation: "#/components/schemas/problemDetail"
          https://contentgrid.cloud/problems/invalid-request-body: "#/components/schemas/problemDetail"
          https://contentgrid.cloud/problems/invalid-request-body/type: "#/components/schemas/problemDetail"
          https://contentgrid.cloud/problems/invalid-request-body/json: "#/components/schemas/problemDetail"
    page:
      type: "object"
      title: "Page metadata"
      properties:
        size:
          type: "integer"
          description: "Number of items shown on a single page"
        total_items_estimate:
          type: "integer"
          description: "Estimated total number of items across all pages"
        total_items_exact:
          type: "integer"
          description: "Exact total number of items across all pages (may be null\
            \ if no exact number could be calculated)"
          nullable: true
        next_cursor:
          type: "string"
          description: "Cursor to access the next page of results (absent if there\
            \ is no next page)"
          example: "0msa4pz0"
        prev_cursor:
          type: "string"
          description: "Cursor to access the previous page of results (absent if there\
            \ is no previous page)"
          example: "1mlpulv1"
      required:
        - "size"
        - "total_items_estimate"
        - "total_items_exact"
    fooResponse:
      type: "object"
      properties:
        id:
          type: "string"
        created_at:
          type: "string"
          nullable: true
          format: "date-time"
        created_by:
          type: "string"
          nullable: true
        last_modified_at:
          type: "string"
          nullable: true
          format: "date-time"
        last_modified_by:
          type: "string"
          nullable: true
        name:
          type: "string"
          nullable: true
        _links:
          type: "object"
          properties:
            self:
              $ref: "#/components/schemas/Link"
          required:
            - "self"
      required:
        - "id"
        - "created_at"
        - "created_by"
        - "last_modified_at"
        - "last_modified_by"
        - "name"
        - "_links"
    fooCollection:
      type: "object"
      properties:
        _embedded:
          type: "object"
          properties:
            item:
              type: "array"
              items:
                $ref: "#/components/schemas/fooResponse"
        page:
          $ref: "#/components/schemas/page"
      required:
        - "page"
    fooPostBody:
      type: "object"
      properties:
        created_at:
          type: "string"
          nullable: true
          format: "date-time"
        last_modified_at:
          type: "string"
          nullable: true
          format: "date-time"
        name:
          type: "string"
          nullable: true
        foo:
          type: "string"
          nullable: true
    fooPostMultipartFormDataBody:
      type: "object"
      properties:
        created_at:
          type: "string"
          nullable: true
          format: "date-time"
        last_modified_at:
          type: "string"
          nullable: true
          format: "date-time"
        name:
          type: "string"
          nullable: true
        foo:
          type: "string"
          nullable: true
    fooPutBody:
      type: "object"
      properties:
        created_at:
          type: "string"
          nullable: true
          format: "date-time"
        last_modified_at:
          type: "string"
          nullable: true
          format: "date-time"
        name:
          type: "string"
          nullable: true
    fooPatchBody:
      type: "object"
      properties:
        created_at:
          type: "string"
          nullable: true
          format: "date-time"
        last_modified_at:
          type: "string"
          nullable: true
          format: "date-time"
        name:
          type: "string"
          nullable: true
