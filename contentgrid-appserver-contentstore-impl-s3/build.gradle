plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.freefair.lombok'
}

dependencies {
    api project(':contentgrid-appserver-contentstore-api')
    implementation project(':contentgrid-appserver-contentstore-impl-utils')
    implementation('software.amazon.awssdk:s3') {
        // Only the synchronous ApacheHttpClient is used; keep the Netty-based async client off the classpath
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }

    testImplementation testFixtures(project(':contentgrid-appserver-contentstore-impl-utils'))
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"

    testImplementation "com.adobe.testing:s3mock-testcontainers"
}

