contentgrid:
  thunx:
    abac:
      source: none
  security:
    csrf.disabled: true
    unauthenticated.allow: true
  appserver:
    content-store.type: ephemeral
    application-model: classpath:application-model.json
  system:
    application-id: dece6818-fab2-11f0-aa04-17747aaadf5e
    deployment-id: e5708fca-fab2-11f0-ab48-1b1797482fc9
    policyPackage: xfb0e9318f3894300a64edba3532e6ac0
  events:
    rabbitmq.enabled: false
    webhook-config-url: http://localhost:${management.server.port}/actuator/webhooks

spring:
  datasource:
    hikari:
      schema: V1
    url: jdbc:tc:postgresql:15:///
  flyway:
    schemas: public
    default-schema: public
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: '*'
  server:
    port: '8081'

