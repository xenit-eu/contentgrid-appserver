contentgrid:
  thunx:
    abac:
      source: none
  security:
    csrf.disabled: true
    unauthenticated.allow: true
  appserver:
    query-engine:
      bootstrap-tables: create
    content-store.type: ephemeral
    blueprint-artifact:
      location: classpath:.
  system:
    application-id: dece6818-fab2-11f0-aa04-17747aaadf5e
    deployment-id: e5708fca-fab2-11f0-ab48-1b1797482fc9
  events:
    rabbitmq.enabled: false
    webhook-config-url: http://localhost:${management.server.port}/actuator/webhooks

spring:
  datasource:
    url: jdbc:tc:postgresql:15:///
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: 'https://auth.contentgrid.com/realms/contentgrid-dev'

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

