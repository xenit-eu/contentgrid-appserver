    post:
      tags:
      - "person"
      operationId: "add-person-friends"
      summary: "Add links to person list that is linked with person as friends, in\
        \ addition to existing person list"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        description: "Newline separated list of person URIs"
        required: true
        content:
          text/uri-list:
            schema:
              type: "string"
              example: "/persons/00000000-0000-0000-0000-000000000000"
      responses:
        "204":
          description: "The list of person is linked with person as friends"
        "409":
          description: "The URI list contains some person that is already linked with\
            \ a different person as friends"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    delete:
      tags:
      - "person"
      operationId: "delete-person-friends"
      summary: "Removes all links to person from friends"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "All links to person have been removed from friends"
        "409":
          description: "You can not remove the friends link, because the inverse relation\
            \ is marked as required"
  /persons/{id}/friends/{itemId}:
    get:
      tags:
      - "person"
      operationId: "get-person-friends-item"
      summary: "Retrieve the person identified by 'itemId' linked with person as friends"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "itemId"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/personResponse"
        "404":
          description: "The friends relation does not link to the person identified\
            \ by 'itemId'"
    delete:
      tags:
      - "person"
      operationId: "delete-person-friends-item"
      summary: "Removes the link to person identified by 'itemId' from friends"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "itemId"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "The link to person has been removed from friends"
        "409":
          description: "You can not remove the friends link, because the inverse relation\
            \ is marked as required"
  /shipments:
    get:
      tags:
      - "shipment"
      operationId: "get-shipments"
      summary: "Retrieve shipment list"
      parameters:
      - name: "address_city"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "address_country"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "address_residence_street"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "address_residence_number"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "invoice.number"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "invoice.amount"
        in: "query"
        description: ""
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "invoice.amount~lt"
        in: "query"
        description: "Less than amount"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "invoice.amount~lte"
        in: "query"
        description: "Less than or equal to amount"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "invoice.amount~gt"
        in: "query"
        description: "Greater than amount"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "invoice.amount~gte"
        in: "query"
        description: "Greater than or equal to amount"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "_cursor"
        in: "query"
        description: "Cursor to access a page (cursors are server-generated and supplied\
          \ in the page metadata)"
        required: false
        schema:
          type: "string"
          example: "1mlpulv1"
      - name: "_size"
        in: "query"
        description: "Page size"
        required: false
        schema:
          type: "integer"
      - name: "_sort"
        in: "query"
        required: false
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "address_city,asc"
            - "address_city,desc"
            - "address_country,asc"
            - "address_country,desc"
            - "address_residence_street,asc"
            - "address_residence_street,desc"
            - "address_residence_number,asc"
            - "address_residence_number,desc"
            example: "address_city,asc"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shipmentCollection"
    post:
      tags:
      - "shipment"
      operationId: "create-shipment"
      summary: "Create a new shipment"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/shipmentPostBody"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/shipmentPostMultipartFormDataBody"
      responses:
        "201":
          description: "The shipment has been created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shipmentResponse"
        "400":
          description: "The shipment can not be created due to a problem with the\
            \ submitted data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The shipment can not be created due to a unique attribute\
            \ already existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
