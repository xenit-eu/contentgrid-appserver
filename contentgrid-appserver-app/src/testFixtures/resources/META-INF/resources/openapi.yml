openapi: "3.0.2"
info:
  description: "ContentGrid app for demo/test"
  version: "0.0.1-SNAPSHOT"
  title: "TestApiApplication"
tags:
- name: "person"
  description: ""
- name: "shipment"
  description: ""
- name: "invoice"
  description: ""
paths:
  /persons:
    get:
      tags:
      - "person"
      operationId: "get-persons"
      summary: "Retrieve person list"
      parameters:
      - name: "first_name"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "last_name"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "comment~prefix"
        in: "query"
        description: "Starts with comment"
        required: false
        schema:
          type: "string"
      - name: "comment~fts"
        in: "query"
        description: "Full text search comment"
        required: false
        schema:
          type: "string"
      - name: "invoices.number"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "invoices.amount"
        in: "query"
        description: ""
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "invoices.amount~lt"
        in: "query"
        description: "Less than amount"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "invoices.amount~lte"
        in: "query"
        description: "Less than or equal to amount"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "invoices.amount~gt"
        in: "query"
        description: "Greater than amount"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "invoices.amount~gte"
        in: "query"
        description: "Greater than or equal to amount"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "friends.first_name"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "friends.last_name"
        in: "query"
        description: ""
        required: false
        schema:
          type: "string"
      - name: "friends.comment~prefix"
        in: "query"
        description: "Starts with comment"
        required: false
        schema:
          type: "string"
      - name: "friends.comment~fts"
        in: "query"
        description: "Full text search comment"
        required: false
        schema:
          type: "string"
      - name: "_cursor"
        in: "query"
        description: "Cursor to access a page (cursors are server-generated and supplied\
          \ in the page metadata)"
        required: false
        schema:
          type: "string"
          example: "1mlpulv1"
      - name: "_size"
        in: "query"
        description: "Page size"
        required: false
        schema:
          type: "integer"
      - name: "_sort"
        in: "query"
        required: false
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "first_name,asc"
            - "first_name,desc"
            - "last_name,asc"
            - "last_name,desc"
            example: "first_name,asc"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/personCollection"
    post:
      tags:
      - "person"
      operationId: "create-person"
      summary: "Create a new person"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/personPostBody"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/personPostMultipartFormDataBody"
      responses:
        "201":
          description: "The person has been created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/personResponse"
        "400":
          description: "The person can not be created due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The person can not be created due to a unique attribute already\
            \ existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
  /persons/{id}:
    get:
      tags:
      - "person"
      operationId: "get-person"
      summary: "Retrieve the person"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/personResponse"
    put:
      tags:
      - "person"
      operationId: "update-person"
      summary: "Update all attributes of the person"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/personPutBody"
      responses:
        "200":
          description: "The person has been updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/personResponse"
        "400":
          description: "The person can not be updated due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The person can not be updated due to a unique attribute already\
            \ existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    patch:
      tags:
      - "person"
      operationId: "patch-person"
      summary: "Update some attributes of the person"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        description: "Only attributes that have to be updated should be specified,\
          \ other attributes should not be present"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/personPatchBody"
      responses:
        "200":
          description: "The person has been updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/personResponse"
        "400":
          description: "The person can not be updated due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The person can not be updated due to a unique attribute already\
            \ existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    delete:
      tags:
      - "person"
      operationId: "delete-person"
      summary: "Delete the person"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "The person has been deleted"
        "409":
          description: "The person can not be deleted because it is linked via a required\
            \ relation"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
  /persons/{id}/invoices:
    get:
      tags:
      - "person"
      operationId: "get-person-invoices"
      summary: "Retrieve the invoice list linked with person as invoices"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/invoiceCollection"
    post:
      tags:
      - "person"
      operationId: "add-person-invoices"
      summary: "Add links to invoice list that is linked with person as invoices,\
        \ in addition to existing invoice list"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        description: "Newline separated list of invoice URIs"
        required: true
        content:
          text/uri-list:
            schema:
              type: "string"
              example: "/invoices/00000000-0000-0000-0000-000000000000"
      responses:
        "204":
          description: "The list of invoice is linked with person as invoices"
        "409":
          description: "The URI list contains some invoice that is already linked\
            \ with a different person as invoices"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    delete:
      tags:
      - "person"
      operationId: "delete-person-invoices"
      summary: "Removes all links to invoice from invoices"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "All links to invoice have been removed from invoices"
        "409":
          description: "You can not remove the invoices link, because the inverse\
            \ relation is marked as required"
  /persons/{id}/invoices/{itemId}:
    get:
      tags:
      - "person"
      operationId: "get-person-invoices-item"
      summary: "Retrieve the invoice identified by 'itemId' linked with person as\
        \ invoices"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "itemId"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/invoiceResponse"
        "404":
          description: "The invoices relation does not link to the invoice identified\
            \ by 'itemId'"
    delete:
      tags:
      - "person"
      operationId: "delete-person-invoices-item"
      summary: "Removes the link to invoice identified by 'itemId' from invoices"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "itemId"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "The link to invoice has been removed from invoices"
        "409":
          description: "You can not remove the invoices link, because the inverse\
            \ relation is marked as required"
  /persons/{id}/friends:
    get:
      tags:
      - "person"
      operationId: "get-person-friends"
      summary: "Retrieve the person list linked with person as friends"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
