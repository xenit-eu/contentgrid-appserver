      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/shipmentPutBody"
      responses:
        "200":
          description: "The shipment has been updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shipmentResponse"
        "400":
          description: "The shipment can not be updated due to a problem with the\
            \ submitted data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The shipment can not be updated due to a unique attribute\
            \ already existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    patch:
      tags:
      - "shipment"
      operationId: "patch-shipment"
      summary: "Update some attributes of the shipment"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        description: "Only attributes that have to be updated should be specified,\
          \ other attributes should not be present"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/shipmentPatchBody"
      responses:
        "200":
          description: "The shipment has been updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shipmentResponse"
        "400":
          description: "The shipment can not be updated due to a problem with the\
            \ submitted data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The shipment can not be updated due to a unique attribute\
            \ already existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    delete:
      tags:
      - "shipment"
      operationId: "delete-shipment"
