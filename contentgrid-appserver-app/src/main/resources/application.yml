spring:
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  flyway:
    schemas: public
    default-schema: public
server:
  port: ${PORT:8080}
  tomcat:
    max-part-count: 200
  server:
    port: 8081
  health:
    rabbit:
      enabled: true
