contentgrid:
  thunx:
    abac:
      source: none
  appserver:
    query-engine.bootstrap-tables: true
    content-store.type: ephemeral
  system:
    policyPackage: xfb0e9318f3894300a64edba3532e6ac0
  security:
    csrf.disabled: ${CG_DISABLE_WEBSECURITY:true}
    unauthenticated.allow: ${CG_DISABLE_WEBSECURITY:true}
spring:
  datasource.url: ${DB_URL:jdbc:tc:postgresql:15:///}
  mvc.problemdetails.enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8082/realms/contentgrid-dev}
server:
  port: ${PORT:8080}
  max-http-request-header-size: 10MB  # needed for abac-context
management:
  endpoints:
    web:
      exposure:
        include: '*'
  server:
    port: '8081'
