spring:
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  flyway:
    schemas: public
    default-schema: public
server:
  port: ${PORT:8080}
  tomcat:
    max-part-count: 200
management:
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - opa
      show-details: when-authorized
  server:
    port: 8081
  health:
    rabbit:
      enabled: true

opa:
  service:
    url: http://localhost:8181
  query: data.contentgrid.appserver.allow == true
