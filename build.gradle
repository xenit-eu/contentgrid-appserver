plugins {
    id "org.sonarqube" version "7.5.0.8588"
    id "be.vbgn.ci-detect" version "0.5.0"
    id "com.diffplug.spotless" apply false
}

sonar {
    properties {
        property "sonar.projectKey", "xenit-eu_contentgrid-appserver"
        property "sonar.organization", "xenit-eu"
        property "sonar.host.url", "https://sonarcloud.io"
        if (ci.isPullRequest()) {
            properties["sonar.pullrequest.key"] = ci.getPullRequest()
            properties["sonar.pullrequest.branch"] = ci.branch
            properties["sonar.pullrequest.base"] = ci.pullRequestTargetBranch
        } else {
            // GIT_BRANCH allows to push from local development directly to SonarCloud
            properties["sonar.branch.name"] = ci.reference != null ? ci.reference : "$System.env.GIT_BRANCH"
        }
    }
}

allprojects {
    pluginManager.withPlugin("java-library") {
        apply plugin: 'jacoco'
        apply plugin: 'com.diffplug.spotless'

        // The conventions plugin contributes removeUnusedImports() and expandWildcardImports().
        // expandWildcardImports() needs to resolve every symbol from the compile classpath, which
        // fails on Lombok-generated members (builders, getters, ...) and on test-fixture imports,
        // see https://github.com/diffplug/spotless/issues/2845. That makes it unusable here, so we
        // take ownership of the java steps and keep only the unused-import removal.
        spotless {
            java {
                clearSteps()
                removeUnusedImports()
            }
        }

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            withSourcesJar()
            withJavadocJar()
        }

        dependencies {
            api platform(project(":contentgrid-appserver-platform"))

            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }

        tasks.named('test').configure {
            useJUnitPlatform()
            finalizedBy tasks.named('jacocoTestReport')
        }

        tasks.named('jacocoTestReport').configure {
            dependsOn tasks.named('test') // tests are required to run before generating the report
            reports {
                xml.required = true
                html.required = true
            }
        }
    }

    pluginManager.withPlugin('maven-publish') {
        apply from: "${rootDir}/gradle/publish.gradle"
    }
}