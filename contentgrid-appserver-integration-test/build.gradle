plugins {
    id 'java-library'
    id 'io.freefair.lombok'
    id 'java-test-fixtures'
    id 'org.springframework.boot'
}

dependencies {

    testFixturesImplementation project(':contentgrid-appserver-spring-boot-starter')

    testImplementation project(':contentgrid-appserver-domain')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.hateoas:spring-hateoas'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:minio:1.21.3'
    testImplementation 'io.minio:minio'
}
