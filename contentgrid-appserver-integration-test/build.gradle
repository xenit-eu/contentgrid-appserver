plugins {
    id 'java-library'
    id 'io.freefair.lombok'
    id 'java-test-fixtures'
}

dependencies {

    testFixturesImplementation project(':contentgrid-appserver-spring-boot-starter')
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesImplementation 'org.testcontainers:testcontainers-postgresql'
    testFixturesImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testFixturesRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testFixturesRuntimeOnly 'org.postgresql:postgresql'


    testImplementation project(':contentgrid-appserver-domain')
    // should not be used for most integration tests, but relevant for encryption compatibility
    testImplementation project(':contentgrid-appserver-contentstore-impl-encryption')
    // Needed for AppserverOpaInputProvider/ActorConverter/UserGrantedAuthorityConverter in the OPA
    // residual-authorization integration test; spring-boot-starter only exposes this as testFixturesImplementation
    testImplementation project(':contentgrid-appserver-autoconfigure')
    // should not be used for most integration tests, only for testing data migrations
    testImplementation 'org.jooq:jooq'
    testImplementation testFixtures(project(':contentgrid-appserver-rest'))
    testImplementation testFixtures(project(':contentgrid-appserver-contentstore-impl-utils'))

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.hateoas:spring-hateoas'
    testImplementation 'org.springframework.security:spring-security-oauth2-jose'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.springframework:spring-webflux'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'com.adobe.testing:s3mock-testcontainers'
    // Needed to define an OpaInputProvider bean (mirroring contentgrid-appserver-app's ContentgridApp) so
    // the OPA residual-authorization integration test gets the appserver input shape rather than thunx's default
    testImplementation 'com.contentgrid.thunx:thunx-pdp-opa'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'

}
