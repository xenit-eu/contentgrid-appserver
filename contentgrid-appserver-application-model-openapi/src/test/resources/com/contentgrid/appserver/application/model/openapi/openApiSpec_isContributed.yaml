components:
  schemas:
    ContentInfo:
      type: "object"
      properties:
        filename:
          oneOf:
          - type: "string"
            title: "Filename"
          - type: "null"
        mimetype:
          type: "string"
          title: "Mimetype"
          description: "Technical indicator of the type of the file"
        length:
          type: "integer"
          format: "int64"
          title: "Size"
          description: "File size in bytes"
      required:
      - "filename"
      - "mimetype"
      - "length"
    Link:
      type: "object"
      properties:
        href:
          type: "string"
          format: "uri"
      required:
      - "href"
    partyResponse:
      type: "object"
      title: "party"
      description: "An individual or organization"
      properties:
        id:
          type: "string"
          format: "uuid"
        vat:
          type: "string"
          description: "Vat number"
        name:
          type: "string"
          description: "Name of the party"
        summary:
          oneOf:
          - $ref: "#/components/schemas/ContentInfo"
          - type: "null"
        _links:
          type: "object"
          properties:
            self:
              $ref: "#/components/schemas/Link"
          required:
          - "self"
      required:
      - "id"
      - "vat"
      - "name"
      - "summary"
      - "_links"
    page:
      type: "object"
      title: "Page metadata"
      properties:
        size:
          type: "integer"
          description: "Number of items shown on a single page"
        total_items_estimate:
          type: "integer"
          description: "Estimated total number of items across all pages"
        total_items_exact:
          type: "integer"
          description: "Exact total number of items across all pages (may be absent\
            \ if no exact number could be calculated)"
        next_cursor:
          type: "string"
          description: "Cursor to access the next page of results (absent if there\
            \ is no next page)"
          examples:
          - "0msa4pz0"
        prev_cursor:
          type: "string"
          description: "Cursor to access the previous page of results (absent if there\
            \ is no previous page)"
          examples:
          - "1mlpulv1"
      required:
      - "size"
      - "total_items_estimate"
    partyCollection:
      type: "object"
      properties:
        _embedded:
          type: "object"
          properties:
            item:
              type: "array"
              items:
                $ref: "#/components/schemas/partyResponse"
        page:
          $ref: "#/components/schemas/page"
      required:
      - "page"
    problemDetail:
      type: "object"
      properties:
        type:
          type: "string"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type: "string"
        instance:
          type: "string"
    problemDetail.invalid-query-parameter.base:
      allOf:
      - $ref: "#/components/schemas/problemDetail"
      - type: "object"
        title: "A query parameter is not valid"
        properties:
          status:
            const: 400
          query_parameter:
            type: "string"
        required:
        - "status"
        - "query_parameter"
    problemDetail.invalid-query-parameter.filter-format:
      allOf:
      - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.base"
      - type: "object"
        title: "Filter value is of wrong format"
        description: "The value of a filter does not match the expected format"
        properties:
          type:
            const: "https://contentgrid.cloud/problems/invalid-query-parameter/filter/format"
          expected_type:
            type: "string"
          format_error:
            type: "string"
          additional_errors:
            type: "array"
            items:
              $ref: "#/components/schemas/problemDetail.invalid-query-parameter.filter-format"
        required:
        - "type"
        - "expected_type"
        - "format_error"
        - "additional_errors"
    problemDetail.invalid-query-parameter.sort-format:
      allOf:
      - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.base"
      - type: "object"
        title: "The sort parameter is malformed"
        properties:
          type:
            const: "https://contentgrid.cloud/problems/invalid-query-parameter/sort/format"
          query_parameter:
            const: "_sort"
          format_error:
            type: "string"
        required:
        - "type"
        - "query_parameter"
        - "format_error"
    problemDetail.invalid-query-parameter.sort-target:
      allOf:
      - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.base"
      - type: "object"
        title: "Invalid sort target"
        description: "The sort parameter refers to a target that doesn't exist or\
          \ on which sorting is not possible"
        properties:
          type:
            const: "https://contentgrid.cloud/problems/invalid-query-parameter/sort/target"
          query_parameter:
            const: "_sort"
          target_name:
            type: "string"
        required:
        - "type"
        - "query_parameter"
        - "target_name"
    problemDetail.invalid-query-parameter.pagination:
      allOf:
      - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.base"
      - type: "object"
        title: "Invalid pagination parameter"
        properties:
          type:
            const: "https://contentgrid.cloud/problems/invalid-query-parameter/pagination"
          query_parameter:
            type: "string"
            enum:
            - "_limit"
            - "_cursor"
          format_error:
            type: "string"
        required:
        - "type"
        - "query_parameter"
        - "format_error"
    problemDetail.invalid-query-parameter.composite:
      discriminator:
        propertyName: "type"
        mapping:
          https://contentgrid.cloud/problems/invalid-query-parameter/filter/format: "#/components/schemas/problemDetail.invalid-query-parameter.filter-format"
          https://contentgrid.cloud/problems/invalid-query-parameter/pagination: "#/components/schemas/problemDetail.invalid-query-parameter.pagination"
          https://contentgrid.cloud/problems/invalid-query-parameter/sort/format: "#/components/schemas/problemDetail.invalid-query-parameter.sort-format"
          https://contentgrid.cloud/problems/invalid-query-parameter/sort/target: "#/components/schemas/problemDetail.invalid-query-parameter.sort-target"
        defaultMapping: "#/components/schemas/problemDetail.invalid-query-parameter.base"
      oneOf:
      - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.filter-format"
      - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.sort-format"
      - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.sort-target"
      - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.pagination"
    problemDetail.invalid-request-header:
      allOf:
      - $ref: "#/components/schemas/problemDetail"
      - type: "object"
        title: "Invalid request header"
        properties:
          type:
            type: "string"
            enum:
            - "https://contentgrid.cloud/problems/invalid-request/required-header"
            - "https://contentgrid.cloud/problems/invalid-request/forbidden-header"
            - "https://contentgrid.cloud/problems/invalid-request/invalid-header"
          status:
            const: 400
          header:
            type: "string"
        required:
        - "type"
        - "status"
        - "header"
    partyPostBody:
      type: "object"
      title: "party"
      description: "An individual or organization"
      properties:
        vat:
          type: "string"
          description: "Vat number"
        name:
          type: "string"
          description: "Name of the party"
        subsidiary:
          oneOf:
          - type: "string"
            format: "uri"
            description: "Subsidiary of the party"
            examples:
            - "https://contentgrid-app.example/parties/00000000-0000-0000-0000-000000000000"
          - type: "null"
      required:
      - "vat"
      - "name"
    partyPostMultipartFormDataBody:
      type: "object"
      properties:
        vat:
          type: "string"
          description: "Vat number"
        name:
          type: "string"
          description: "Name of the party"
        summary:
          type: "string"
          format: "binary"
          description: "Pdf file containing a summary of the party"
        subsidiary:
          type: "string"
          format: "uri"
          description: "Subsidiary of the party"
          examples:
          - "https://contentgrid-app.example/parties/00000000-0000-0000-0000-000000000000"
      required:
      - "vat"
      - "name"
    problemDetail.integrity.blind-relation-overwrite:
      allOf:
      - $ref: "#/components/schemas/problemDetail"
      - type: "object"
        title: "Overwrite of an existing relation blocked"
        description: "In a to-one relation, the target entity is already referenced\
          \ by another entity"
        properties:
          type:
            const: "https://contentgrid.cloud/problems/integrity/blind-relation-overwrite"
          status:
            const: 409
          new_item:
            type: "string"
            format: "uri"
          new_relation:
            type: "string"
            format: "uri"
          existing_item:
            type: "string"
            format: "uri"
          existing_relation:
            type: "string"
            format: "uri"
          target_item:
            type: "string"
            format: "uri"
          target_relation:
            type: "string"
            format: "uri"
          additional_errors:
            type: "array"
            items:
              $ref: "#/components/schemas/problemDetail.integrity.blind-relation-overwrite"
        required:
        - "type"
        - "status"
        - "new_item"
        - "new_relation"
        - "existing_item"
        - "existing_relation"
        - "target_item"
        - "additional_errors"
    problemDetail.input-validation.field.base:
      allOf:
      - $ref: "#/components/schemas/problemDetail"
      - type: "object"
        properties:
          field:
            type: "string"
            description: "Refers to the specific input field for which validation\
              \ failed with a property path"
        required:
        - "field"
    problemDetail.input-validation.field.type:
      allOf:
      - $ref: "#/components/schemas/problemDetail.input-validation.field.base"
