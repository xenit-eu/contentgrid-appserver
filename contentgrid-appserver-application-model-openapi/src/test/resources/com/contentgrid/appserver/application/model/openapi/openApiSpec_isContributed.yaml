      operationId: "get-insurance-case-pdf"
      summary: "Retrieve the pdf file stored with insurance-case"
      responses:
        "200":
          description: "Contents of the stored file"
          content:
            '*/*':
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "No pdf file is stored with insurance-case"
    put:
      tags:
      - "insurance-case"
      operationId: "put-insurance-case-pdf"
      summary: "Add or update the pdf file stored with insurance-case"
      requestBody:
        description: "File data to store"
        required: true
        content:
          '*/*':
            schema:
              type: "string"
              format: "binary"
      responses:
        "204":
          description: "The file is uploaded"
    post:
      tags:
      - "insurance-case"
      operationId: "post-insurance-case-pdf"
      summary: "Add or update the pdf file stored with insurance-case"
      requestBody:
        description: "File data to store"
        required: true
        content:
          '*/*':
            schema:
              type: "string"
              format: "binary"
      responses:
        "204":
          description: "The file is uploaded"
    delete:
      tags:
      - "insurance-case"
      operationId: "delete-insurance-case-pdf"
      summary: "Delete the pdf file stored with insurance-case"
      responses:
        "204":
          description: "The file has been deleted"
  /insurance-cases/{id}/thumb-nail:
    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    get:
      tags:
      - "insurance-case"
      operationId: "get-insurance-case-thumb_nail"
      summary: "Retrieve the thumb_nail file stored with insurance-case"
      responses:
        "200":
          description: "Contents of the stored file"
          content:
            '*/*':
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "No thumb_nail file is stored with insurance-case"
    put:
      tags:
      - "insurance-case"
      operationId: "put-insurance-case-thumb_nail"
      summary: "Add or update the thumb_nail file stored with insurance-case"
      requestBody:
        description: "File data to store"
        required: true
        content:
          '*/*':
            schema:
              type: "string"
              format: "binary"
      responses:
        "204":
          description: "The file is uploaded"
    post:
      tags:
      - "insurance-case"
      operationId: "post-insurance-case-thumb_nail"
      summary: "Add or update the thumb_nail file stored with insurance-case"
      requestBody:
        description: "File data to store"
        required: true
        content:
          '*/*':
            schema:
              type: "string"
              format: "binary"
      responses:
        "204":
          description: "The file is uploaded"
    delete:
      tags:
      - "insurance-case"
      operationId: "delete-insurance-case-thumb_nail"
      summary: "Delete the thumb_nail file stored with insurance-case"
      responses:
        "204":
          description: "The file has been deleted"
components:
  schemas:
    ContentInfo:
      type: "object"
      properties:
        filename:
          oneOf:
          - type: "string"
            title: "Filename"
          - type: "null"
        mimetype:
          type: "string"
          title: "Mimetype"
          description: "Technical indicator of the type of the file"
        length:
          type: "integer"
          format: "int64"
          title: "Size"
          description: "File size in bytes"
      required:
      - "filename"
      - "mimetype"
      - "length"
    Link:
      type: "object"
      properties:
        href:
          type: "string"
          format: "uri"
      required:
      - "href"
    partyResponse:
      type: "object"
      title: "party"
      description: "An individual or organization"
      properties:
        id:
          type: "string"
          format: "uuid"
        vat:
          type: "string"
          description: "Vat number"
        name:
          type: "string"
          description: "Name of the party"
        summary:
          oneOf:
          - $ref: "#/components/schemas/ContentInfo"
          - type: "null"
        _links:
          type: "object"
          properties:
            self:
              $ref: "#/components/schemas/Link"
          required:
          - "self"
      required:
      - "id"
      - "vat"
      - "name"
      - "summary"
      - "_links"
    page:
      type: "object"
      title: "Page metadata"
      properties:
        size:
          type: "integer"
          description: "Number of items shown on a single page"
        total_items_estimate:
          type: "integer"
          description: "Estimated total number of items across all pages"
        total_items_exact:
          type: "integer"
          description: "Exact total number of items across all pages (may be absent\
            \ if no exact number could be calculated)"
        next_cursor:
          type: "string"
          description: "Cursor to access the next page of results (absent if there\
            \ is no next page)"
          examples:
          - "0msa4pz0"
        prev_cursor:
          type: "string"
          description: "Cursor to access the previous page of results (absent if there\
            \ is no previous page)"
          examples:
          - "1mlpulv1"
      required:
      - "size"
      - "total_items_estimate"
    partyCollection:
      type: "object"
      properties:
        _embedded:
          type: "object"
          properties:
            item:
              type: "array"
              items:
                $ref: "#/components/schemas/partyResponse"
        page:
          $ref: "#/components/schemas/page"
      required:
      - "page"
