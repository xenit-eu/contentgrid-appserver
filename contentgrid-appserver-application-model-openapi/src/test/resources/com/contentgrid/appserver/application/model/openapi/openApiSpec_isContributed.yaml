      - $ref: "#/components/schemas/problemDetail.input-validation.field.required"
      - $ref: "#/components/schemas/problemDetail.input-validation.field.duplicate"
      - $ref: "#/components/schemas/problemDetail.input-validation.field.allowed-values"
      - $ref: "#/components/schemas/problemDetail.input-validation.field.pattern"
