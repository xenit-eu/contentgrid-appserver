openapi: "3.2.0"
info:
  title: "DemoApplication"
  version: "1.0"
tags:
- name: "party"
  description: "An individual or organization"
  kind: "nav"
- name: "insurance-case"
  description: ""
  kind: "nav"
paths:
  /parties:
    get:
      tags:
      - "party"
      operationId: "list.party"
      summary: "Retrieve party list"
      parameters:
      - name: "name"
        in: "query"
        description: "Name of the party"
        schema:
          type: "string"
      - name: "name~prefix"
        in: "query"
        description: "Starts with name"
        schema:
          type: "string"
      - name: "subsidiary.name"
        in: "query"
        description: "Subsidiary: Name of the party"
        schema:
          type: "string"
      - name: "subsidiary.name~prefix"
        in: "query"
        description: "Subsidiary: Starts with name"
        schema:
          type: "string"
      - name: "_sort"
        in: "query"
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "name,asc"
            - "name,desc"
      - name: "_cursor"
        in: "query"
        description: "Cursor to access a page (cursors are server-generated and supplied\
          \ in the page metadata)"
        schema:
          type: "string"
          examples:
          - "1mlpulv1"
      - name: "_size"
        in: "query"
        description: "Page size"
        schema:
          type: "integer"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/partyCollection"
        "400":
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.composite"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
    post:
      tags:
      - "party"
      operationId: "create.party"
      summary: "Create a new party"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/partyPostBody"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/partyPostMultipartFormDataBody"
      responses:
        "201":
          description: "The party has been created"
          headers:
            Location:
              description: "The URL of the created party"
              required: true
              schema:
                type: "string"
                format: "uri"
                examples:
                - "https://contentgrid-app.example/parties/00000000-0000-0000-0000-000000000000"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/partyResponse"
        "400":
          description: "The party can not be created due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.integrity.blind-relation-overwrite"
  /parties/{id}:
    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    get:
      tags:
      - "party"
      operationId: "get.party"
      summary: "Retrieve the party"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/partyResponse"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
    put:
      tags:
      - "party"
      operationId: "update.party"
      summary: "Update all attributes of the party"
      requestBody:
        description: "All attributes of the party have to be specified. Missing attributes\
          \ are treated as null"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/partyPutBody"
      responses:
        "204":
          description: "The party has been updated"
        "400":
          description: "The party can not be updated due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
    patch:
      tags:
      - "party"
      operationId: "patch.party"
      summary: "Update some attributes of the party"
      requestBody:
        description: "Only attributes that have to be updated should be specified,\
          \ other attributes should not be present"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/partyPatchBody"
      responses:
        "204":
          description: "The party has been updated"
        "400":
          description: "The party can not be updated due to a problem with the submitted\
            \ data"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
    delete:
      tags:
      - "party"
      operationId: "delete.party"
      summary: "Delete the party"
      responses:
        "204":
          description: "The party has been deleted"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "409":
          description: "The party can not be deleted because it is linked via a required\
            \ relation"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.required-relation"
  /parties/{id}/subsidiary:
    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    get:
      tags:
      - "party"
      operationId: "get.party.subsidiary"
      summary: "Retrieve the party linked with party as subsidiary"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/partyResponse"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          description: "The subsidiary relation does not link to any party"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.not-found.entity-item"
                - $ref: "#/components/schemas/problemDetail.not-found.relation-item"
    put:
      tags:
      - "party"
      operationId: "set.party.subsidiary"
      summary: "Set the party that is linked with party as subsidiary"
      requestBody:
        description: "One party URI"
        required: true
        content:
          text/uri-list:
            schema:
              type: "string"
              format: "uri"
              examples:
              - "https://contentgrid-app.example/parties/00000000-0000-0000-0000-000000000000"
      responses:
        "204":
          description: "The party is linked with party as subsidiary"
        "400":
          description: "Multiple URIs are given, but subsidiary can only refer to\
            \ one item"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "409":
          description: "The URI list contains some party that is already linked with\
            \ a different party as subsidiary"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.integrity.blind-relation-overwrite"
    delete:
      tags:
      - "party"
      operationId: "clear.party.subsidiary"
      summary: "Removes the link to party from subsidiary"
      responses:
        "204":
          description: "The link to party has been removed from subsidiary"
        "400":
          description: "You can not remove the subsidiary link, because it is marked\
            \ as required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.not-found.entity-item"
                - $ref: "#/components/schemas/problemDetail.not-found.relation-item"
        "409":
          description: "You can not remove the subsidiary link, because the inverse\
            \ relation is marked as required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.required-relation"
  /parties/{id}/summary:
    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    get:
      tags:
      - "party"
      operationId: "get.party.summary"
      summary: "Retrieve the summary file stored with party"
      parameters:
      - $ref: "#/components/parameters/header.If-Match"
      - $ref: "#/components/parameters/header.If-None-Match"
      responses:
        "200":
          description: "Contents of the stored file"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            '*/*':
              schema:
                type: "string"
                format: "binary"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          description: "No summary file is stored with party"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "412":
          $ref: "#/components/responses/preconditionFailed"
    put:
      tags:
      - "party"
      operationId: "set.party.summary"
      summary: "Add or update the summary file stored with party"
      parameters:
      - $ref: "#/components/parameters/header.If-Match"
      - $ref: "#/components/parameters/header.If-None-Match"
      requestBody:
        description: "File data to store"
        required: true
        content:
          '*/*':
            schema:
              type: "string"
              format: "binary"
      responses:
        "204":
          description: "The file is uploaded"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "412":
          $ref: "#/components/responses/preconditionFailed"
    delete:
      tags:
      - "party"
      operationId: "delete.party.summary"
      summary: "Delete the summary file stored with party"
      parameters:
      - $ref: "#/components/parameters/header.If-Match"
      - $ref: "#/components/parameters/header.If-None-Match"
      responses:
        "204":
          description: "The file has been deleted"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "412":
          $ref: "#/components/responses/preconditionFailed"
  /insurance-cases:
    get:
      tags:
      - "insurance-case"
      operationId: "list.insurance-case"
      summary: "Retrieve insurance-case list"
      parameters:
      - name: "owning_party.name"
        in: "query"
        description: "Owning party: Name of the party"
        schema:
          type: "string"
      - name: "owning_party.name~prefix"
        in: "query"
        description: "Owning party: Starts with name"
        schema:
          type: "string"
      - name: "_cursor"
        in: "query"
        description: "Cursor to access a page (cursors are server-generated and supplied\
          \ in the page metadata)"
        schema:
          type: "string"
          examples:
          - "1mlpulv1"
      - name: "_size"
        in: "query"
        description: "Page size"
        schema:
          type: "integer"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/insurance-caseCollection"
        "400":
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.invalid-query-parameter.composite"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
    post:
      tags:
      - "insurance-case"
      operationId: "create.insurance-case"
      summary: "Create a new insurance-case"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/insurance-casePostBody"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/insurance-casePostMultipartFormDataBody"
      responses:
        "201":
          description: "The insurance-case has been created"
          headers:
            Location:
              description: "The URL of the created insurance-case"
              required: true
              schema:
                type: "string"
                format: "uri"
                examples:
                - "https://contentgrid-app.example/insurance-cases/00000000-0000-0000-0000-000000000000"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/insurance-caseResponse"
        "400":
          description: "The insurance-case can not be created due to a problem with\
            \ the submitted data"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.integrity.blind-relation-overwrite"
  /insurance-cases/{id}:
    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    get:
      tags:
      - "insurance-case"
      operationId: "get.insurance-case"
      summary: "Retrieve the insurance-case"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/insurance-caseResponse"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
    put:
      tags:
      - "insurance-case"
      operationId: "update.insurance-case"
      summary: "Update all attributes of the insurance-case"
      requestBody:
        description: "All attributes of the insurance-case have to be specified. Missing\
          \ attributes are treated as null"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/insurance-casePutBody"
      responses:
        "204":
          description: "The insurance-case has been updated"
        "400":
          description: "The insurance-case can not be updated due to a problem with\
            \ the submitted data"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
    patch:
      tags:
      - "insurance-case"
      operationId: "patch.insurance-case"
      summary: "Update some attributes of the insurance-case"
      requestBody:
        description: "Only attributes that have to be updated should be specified,\
          \ other attributes should not be present"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/insurance-casePatchBody"
      responses:
        "204":
          description: "The insurance-case has been updated"
        "400":
          description: "The insurance-case can not be updated due to a problem with\
            \ the submitted data"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
    delete:
      tags:
      - "insurance-case"
      operationId: "delete.insurance-case"
      summary: "Delete the insurance-case"
      responses:
        "204":
          description: "The insurance-case has been deleted"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "409":
          description: "The insurance-case can not be deleted because it is linked\
            \ via a required relation"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.required-relation"
  /insurance-cases/{id}/owning-party:
    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    get:
      tags:
      - "insurance-case"
      operationId: "get.insurance-case.owning_party"
      summary: "Retrieve the party linked with insurance-case as owning_party"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/partyResponse"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          description: "The owning_party relation does not link to any party"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.not-found.entity-item"
                - $ref: "#/components/schemas/problemDetail.not-found.relation-item"
    put:
      tags:
      - "insurance-case"
      operationId: "set.insurance-case.owning_party"
      summary: "Set the party that is linked with insurance-case as owning_party"
      requestBody:
        description: "One party URI"
        required: true
        content:
          text/uri-list:
            schema:
              type: "string"
              format: "uri"
              examples:
              - "https://contentgrid-app.example/parties/00000000-0000-0000-0000-000000000000"
      responses:
        "204":
          description: "The party is linked with insurance-case as owning_party"
        "400":
          description: "Multiple URIs are given, but owning_party can only refer to\
            \ one item"
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "409":
          description: "The URI list contains some party that is already linked with\
            \ a different insurance-case as owning_party"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.integrity.blind-relation-overwrite"
    delete:
      tags:
      - "insurance-case"
      operationId: "clear.insurance-case.owning_party"
      summary: "Removes the link to party from owning_party"
      responses:
        "204":
          description: "The link to party has been removed from owning_party"
        "400":
          description: "You can not remove the owning_party link, because it is marked\
            \ as required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.not-found.entity-item"
                - $ref: "#/components/schemas/problemDetail.not-found.relation-item"
        "409":
          description: "You can not remove the owning_party link, because the inverse\
            \ relation is marked as required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.required-relation"
  /insurance-cases/{id}/followups:
    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    get:
      tags:
      - "insurance-case"
      operationId: "get.insurance-case.followups"
      summary: "Retrieve the insurance-case list linked with insurance-case as followups"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/insurance-caseCollection"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
    post:
      tags:
      - "insurance-case"
      operationId: "add.insurance-case.followups"
      summary: "Add links to insurance-case list that is linked with insurance-case\
        \ as followups, in addition to the existing insurance-case list"
      requestBody:
        description: "Newline separated list of insurance-case URIs"
        required: true
        content:
          text/uri-list:
            schema:
              type: "array"
              items:
                type: "string"
                format: "uri"
                examples:
                - "https://contentgrid-app.example/insurance-cases/00000000-0000-0000-0000-000000000000"
      responses:
        "204":
          description: "The list of insurance-case is linked with insurance-case as\
            \ followups"
        "400":
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/problemDetail.input-validation"
                - $ref: "#/components/schemas/problemDetail.invalid-request-header"
                - $ref: "#/components/schemas/problemDetail.invalid-request-body"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "409":
          description: "The URI list contains some insurance-case that is already\
            \ linked with a different insurance-case as followups"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.integrity.blind-relation-overwrite"
    delete:
      tags:
      - "insurance-case"
      operationId: "clear.insurance-case.followups"
      summary: "Removes all links to insurance-case from followups"
      responses:
        "204":
          description: "All links to insurance-case have been removed from followups"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "409":
          description: "You can not remove the followups link, because the inverse\
            \ relation is marked as required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.required-relation"
  /insurance-cases/{id}/followups/{itemId}:
    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    - name: "itemId"
      in: "path"
      required: true
      schema:
