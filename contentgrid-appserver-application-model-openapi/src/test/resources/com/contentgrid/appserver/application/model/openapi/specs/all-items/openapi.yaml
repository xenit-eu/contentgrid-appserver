        "400":
          description: "The sample-entity can not be updated due to a problem with\
            \ the submitted data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail"
        "404":
          description: "Resource not found: Item not found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "412":
          $ref: "#/components/responses/preconditionFailed"
    patch:
      tags:
      - "sample-entity"
      operationId: "patch.sample-entity"
      summary: "Update some attributes of the sample-entity"
      requestBody:
        description: "Only attributes that have to be updated should be specified,\
          \ other attributes should not be present"
        required: true
        content:
          application/json:
            schema:
