      - name: "exact_search_decimal_attribute"
        in: "query"
        description: "Exact search decimal attribute"
        schema:
          type: "number"
          format: "double"
          description: "A double attribute with exact search enabled."
      - name: "exact_search_decimal_attribute~gt"
        in: "query"
        description: "Exact search decimal attribute: Greater than"
        schema:
          type: "number"
          format: "double"
          description: "A double attribute with exact search enabled."
      - name: "exact_search_decimal_attribute~gte"
        in: "query"
        description: "Exact search decimal attribute: Min"
        schema:
          type: "number"
          format: "double"
          description: "A double attribute with exact search enabled."
      - name: "exact_search_decimal_attribute~lt"
        in: "query"
        description: "Exact search decimal attribute: Less than"
        schema:
          type: "number"
          format: "double"
          description: "A double attribute with exact search enabled."
      - name: "exact_search_decimal_attribute~lte"
        in: "query"
        description: "Exact search decimal attribute: Max"
        schema:
          type: "number"
          format: "double"
          description: "A double attribute with exact search enabled."
      - name: "full_text_search_string_attribute~fts"
        in: "query"
        description: "Full text search string attribute: Full Text"
        schema:
          type: "string"
          description: "A string attribute with prefix search enabled, simulating\
            \ full text search."
      - name: "last_modified_at"
        in: "query"
        description: "Last modified at"
        schema:
          type: "string"
          format: "date-time"
          description: "Tracks when the item was last modified."
      - name: "last_modified_at~after"
        in: "query"
        description: "Last modified at: After"
        schema:
          type: "string"
          format: "date-time"
          description: "Tracks when the item was last modified."
      - name: "last_modified_at~before"
        in: "query"
        description: "Last modified at: Before"
        schema:
          type: "string"
          format: "date-time"
          description: "Tracks when the item was last modified."
      - name: "prefix_search_string_attribute~prefix"
        in: "query"
        description: "Prefix search string attribute"
        schema:
          type: "string"
          description: "A string attribute with prefix search enabled."
      - name: "_cursor"
        in: "query"
        description: "Cursor to access a page (cursors are server-generated and supplied\
          \ in the page metadata)"
        schema:
          type: "string"
          examples:
          - "1mlpulv1"
      - name: "_size"
        in: "query"
        description: "Page size"
        schema:
          type: "integer"
      - name: "_sort"
        in: "query"
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "created_at,asc"
            - "created_at,desc"
            - "last_modified_at,asc"
            - "last_modified_at,desc"
            - "exact_search_decimal_attribute,asc"
            - "exact_search_decimal_attribute,desc"
            examples:
            - "created_at,asc"
