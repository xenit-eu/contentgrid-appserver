        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sample-entityPutBody"
      responses:
        "200":
          description: "The sample-entity has been updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sample-entityResponse"
        "400":
          description: "The sample-entity can not be updated due to a problem with\
            \ the submitted data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
