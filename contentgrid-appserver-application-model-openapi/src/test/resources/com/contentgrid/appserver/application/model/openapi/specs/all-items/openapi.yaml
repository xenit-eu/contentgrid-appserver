        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sample-entityCollection"
        "400":
          description: "Bad request: Invalid query parameter, Invalid header"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail"
    post:
