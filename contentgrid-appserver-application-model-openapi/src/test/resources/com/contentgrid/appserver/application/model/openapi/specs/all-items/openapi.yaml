    parameters:
    - name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
    - $ref: "#/components/parameters/header.If-Match"
    - $ref: "#/components/parameters/header.If-None-Match"
    get:
      tags:
      - "sample-entity"
      operationId: "get.sample-entity"
      summary: "Retrieve the sample-entity"
      responses:
        "200":
          description: "OK"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sample-entityResponse"
        "400":
          description: "Bad request: Invalid header"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.invalid-request-header"
        "404":
          description: "Resource not found: Item not found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail.not-found.entity-item"
        "412":
          $ref: "#/components/responses/preconditionFailed"
    put:
      tags:
      - "sample-entity"
      operationId: "update.sample-entity"
      summary: "Update all attributes of the sample-entity"
      requestBody:
        description: "All attributes of the sample-entity have to be specified. Missing\
          \ attributes are treated as null"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sample-entityPutBody"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/sample-entityPutFormBody"
      responses:
        "204":
          description: "The sample-entity has been updated"
          headers:
