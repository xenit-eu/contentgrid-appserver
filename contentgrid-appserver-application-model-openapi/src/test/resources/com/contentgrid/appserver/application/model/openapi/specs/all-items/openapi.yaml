            schema:
              $ref: "#/components/schemas/sample-entityPostMultipartFormDataBody"
      responses:
        "201":
          description: "The sample-entity has been created"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              description: "The URL of the created sample-entity"
              required: true
              schema:
                type: "string"
                format: "uri"
                examples:
                - "https://contentgrid-app.example/sample-entities/00000000-0000-0000-0000-000000000000"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sample-entityResponse"
        "400":
          description: "The sample-entity can not be created due to a problem with\
            \ the submitted data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetail"
        "409":
          description: "Conflict with other data: Would overwrite a relation of another\
            \ item"
