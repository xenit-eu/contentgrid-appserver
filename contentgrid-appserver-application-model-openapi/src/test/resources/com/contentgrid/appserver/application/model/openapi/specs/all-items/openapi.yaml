      - "sample-entity"
      operationId: "patch-sample-entity"
      summary: "Update some attributes of the sample-entity"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        description: "Only attributes that have to be updated should be specified,\
          \ other attributes should not be present"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sample-entityPatchBody"
      responses:
        "200":
          description: "The sample-entity has been updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sample-entityResponse"
        "400":
          description: "The sample-entity can not be updated due to a problem with\
            \ the submitted data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The sample-entity can not be updated due to a unique attribute\
            \ already existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
    delete:
      tags:
      - "sample-entity"
      operationId: "delete-sample-entity"
      summary: "Delete the sample-entity"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "The sample-entity has been deleted"
        "409":
          description: "The sample-entity can not be deleted because it is linked\
            \ via a required relation"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
