openapi: "3.2.0"
info:
  title: "default"
  version: "1.0"
tags:
- name: "sample-entity"
  description: "This entity is designed to demonstrate various attribute types, search\
    \ filters, and constraints."
  kind: "nav"
- name: "entity-a"
  description: "Represents the first entity for demonstrating various types of relations."
  kind: "nav"
- name: "entity-b"
  description: "Represents the second entity for demonstrating various types of relations."
  kind: "nav"
paths:
  /sample-entities:
    get:
      tags:
      - "sample-entity"
      operationId: "get-sample-entities"
      summary: "Retrieve sample-entity list"
      parameters:
      - name: "created_at"
        in: "query"
        description: "Tracks when the item was created."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "created_at~before"
        in: "query"
        description: "Before created_at"
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "created_at~after"
        in: "query"
        description: "After created_at"
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "last_modified_at"
        in: "query"
        description: "Tracks when the item was last modified."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "last_modified_at~before"
        in: "query"
        description: "Before last_modified_at"
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "last_modified_at~after"
        in: "query"
        description: "After last_modified_at"
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "exact_search_decimal_attribute"
        in: "query"
        description: "A double attribute with exact search enabled."
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "exact_search_decimal_attribute~lt"
        in: "query"
        description: "Less than exact_search_decimal_attribute"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "exact_search_decimal_attribute~lte"
        in: "query"
        description: "Less than or equal to exact_search_decimal_attribute"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "exact_search_decimal_attribute~gt"
        in: "query"
        description: "Greater than exact_search_decimal_attribute"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "exact_search_decimal_attribute~gte"
        in: "query"
        description: "Greater than or equal to exact_search_decimal_attribute"
        required: false
        schema:
          type: "number"
          format: "double"
      - name: "prefix_search_string_attribute~prefix"
        in: "query"
        description: "Starts with prefix_search_string_attribute"
        required: false
        schema:
          type: "string"
      - name: "full_text_search_string_attribute~fts"
        in: "query"
        description: "Full text search full_text_search_string_attribute"
        required: false
        schema:
          type: "string"
      - name: "_cursor"
        in: "query"
        description: "Cursor to access a page (cursors are server-generated and supplied\
          \ in the page metadata)"
        required: false
        schema:
          type: "string"
          example: "1mlpulv1"
      - name: "_size"
        in: "query"
        description: "Page size"
        required: false
        schema:
          type: "integer"
      - name: "_sort"
        in: "query"
        required: false
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "created_at,asc"
            - "created_at,desc"
            - "last_modified_at,asc"
            - "last_modified_at,desc"
            - "exact_search_decimal_attribute,asc"
            - "exact_search_decimal_attribute,desc"
            example: "created_at,asc"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sample-entityCollection"
    post:
      tags:
      - "sample-entity"
      operationId: "create-sample-entity"
      summary: "Create a new sample-entity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sample-entityPostBody"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/sample-entityPostMultipartFormDataBody"
      responses:
        "201":
          description: "The sample-entity has been created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/sample-entityResponse"
        "400":
          description: "The sample-entity can not be created due to a problem with\
            \ the submitted data"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
        "409":
          description: "The sample-entity can not be created due to a unique attribute\
            \ already existing with that value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/problemDetailDiscriminator"
  /sample-entities/{id}:
