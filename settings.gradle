pluginManagement {
    plugins {
        id "io.freefair.lombok" version "9.5.0"
        id 'org.springframework.boot' version '4.0.6'
    }
}

plugins {
    id 'org.ajoberstar.reckon.settings' version '2.0.0'
    id 'eu.xenit.enterprise-conventions.oss' version '0.8.0'
}

reckon {
    defaultInferredScope = 'patch'
    snapshots()
    scopeCalc = calcScopeFromCommitMessages()
    stageCalc = { inventory, targetNormal -> java.util.Optional.empty() }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

// LOCAL DEV ONLY: substitutes published com.contentgrid.thunx:* artifacts with the local
// checkout so unreleased thunx changes (thunx-spring-webmvc, WebMvcAbacAutoConfiguration) can
// be built/tested here. Must be removed before this branch is finalized - CI has no ../thunx checkout.
includeBuild('../thunx')

rootProject.name = 'contentgrid-appserver'

include 'contentgrid-appserver-application-model'
include 'contentgrid-appserver-application-model-openapi'
include 'contentgrid-appserver-autoconfigure'
include 'contentgrid-appserver-query-engine-api'
include 'contentgrid-appserver-query-engine-impl-jooq'
include 'contentgrid-appserver-app'
include 'contentgrid-appserver-application-model-json'
include 'contentgrid-appserver-rest'
include 'contentgrid-appserver-domain'
include 'contentgrid-appserver-domain-values'
include 'contentgrid-appserver-domain-spi'
include 'contentgrid-appserver-actuators'
include 'contentgrid-appserver-events'
include 'contentgrid-appserver-platform'
include 'contentgrid-appserver-contentstore-api'
include 'contentgrid-appserver-contentstore-impl-utils'
include 'contentgrid-appserver-contentstore-impl-fs'
include 'contentgrid-appserver-contentstore-impl-s3'
include 'contentgrid-appserver-contentstore-impl-encryption'
include 'contentgrid-appserver-webjars'
include 'contentgrid-appserver-spring-boot-starter'
include 'contentgrid-appserver-integration-test'
include 'contentgrid-appserver-blueprintartifact-impl-fs'
include 'contentgrid-appserver-blueprintartifact-impl-s3'
include 'contentgrid-appserver-blueprintartifact-impl-utils'
