plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'io.freefair.lombok'
}

dependencies {
    implementation project(':contentgrid-appserver-domain-spi')

    testFixturesImplementation project(':contentgrid-appserver-domain-spi')
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter'
    testFixturesImplementation 'org.assertj:assertj-core'
}
