plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'io.freefair.lombok'
}

dependencies {
    api project(':contentgrid-appserver-application-model')
    api project(':contentgrid-appserver-domain')
    implementation project(':contentgrid-appserver-application-model-openapi')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.contentgrid.hateoas:contentgrid-hateoas-spring'
    implementation 'com.contentgrid.thunx:thunx-spring-security'

    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'

    testImplementation project(':contentgrid-appserver-spring-boot-starter')
    testImplementation testFixtures(project(':contentgrid-appserver-application-model'))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'com.contentgrid.thunx:thunx-encoding-json'
    testImplementation 'org.springframework.security:spring-security-test'

    testFixturesImplementation testFixtures(project(':contentgrid-appserver-application-model'))
    testFixturesImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testFixturesImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testFixturesImplementation 'org.springframework:spring-web'
    testFixturesImplementation 'jakarta.servlet:jakarta.servlet-api'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.security:spring-security-test'
    testFixturesImplementation 'org.springframework.security:spring-security-oauth2-jose'
    testFixturesImplementation 'org.springframework.security:spring-security-oauth2-resource-server'
    testFixturesImplementation 'org.assertj:assertj-core'
}

// Required for resolution of variable-name-based controller method parameters
tasks.withType(JavaCompile).configureEach {
    it.options.compilerArgs += "-parameters"
}
