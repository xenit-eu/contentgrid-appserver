plugins {
    id 'java-platform'
    id 'maven-publish'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.0.2')
    api platform('com.contentgrid.thunx:thunx-bom:0.15.0')

    constraints {
        api 'org.hamcrest:hamcrest:3.0'

        api 'com.contentgrid.hateoas:contentgrid-pagination-api:0.0.4'
        api 'com.contentgrid.hateoas:contentgrid-hateoas-spring:0.0.4'

        api 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

        api 'io.minio:minio:8.6.0'

        api 'com.networknt:json-schema-validator:1.5.9'
        api 'uk.co.datumedge:hamcrest-json:0.3'

        api 'commons-io:commons-io:2.21.0'

        api 'org.testcontainers:testcontainers:1.20.0'
        api 'org.testcontainers:junit-jupiter:1.20.0'
        api 'org.testcontainers:postgresql:1.20.0'
        api 'org.testcontainers:rabbitmq:1.20.0'
        api 'org.testcontainers:minio:1.20.0'
    }
}
