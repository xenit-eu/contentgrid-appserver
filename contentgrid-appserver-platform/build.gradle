plugins {
    id 'java-platform'
    id 'maven-publish'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.5.8')
    api platform('com.contentgrid.thunx:thunx-bom:0.13.1')

    constraints {
        api 'org.hamcrest:hamcrest:3.0'

        api 'com.contentgrid.hateoas:contentgrid-pagination-api:0.0.4'
        api 'com.contentgrid.hateoas:contentgrid-hateoas-spring:0.0.4'

        api 'com.fasterxml.uuid:java-uuid-generator:5.1.1'

        api 'io.minio:minio:8.6.0'

        api 'com.networknt:json-schema-validator:2.0.0'
        api 'uk.co.datumedge:hamcrest-json:0.3'

        api 'commons-io:commons-io:2.21.0'
    }
}
